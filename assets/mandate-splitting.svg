<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d"><title id="t">Mandate splitting: six payments that each pass</title><desc id="d">AFT-06, mandate splitting. Left: six payments of $495 to one payee, each just under a $500 per-payment limit, so each passes a per-payment check. Right: the running total of the same payments climbs to $2,970 within one hour, which only a view of the agent’s history shows.</desc><style>
.bg{fill:#FBF9F4}.t{fill:#1C1C1C;font:600 16px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#5F5B52;font:400 13px 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.k{fill:#5F5B52;font:600 11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em}
.bar{fill:#7A766C}.lim{stroke:#B23A26;stroke-width:2;stroke-dasharray:6 5}.limt{fill:#B23A26;font:600 12px 'IBM Plex Sans',system-ui,sans-serif}
.okin{fill:#FBF9F4;font:700 14px system-ui,sans-serif}.ax{stroke:#D9D3C5;stroke-width:1}
.cum{stroke:#4A6100;stroke-width:3;fill:none}.dot{fill:#4A6100}.big{fill:#4A6100;font:700 18px 'IBM Plex Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#1C1C1C}.t{fill:#F3EFE6}.s,.k{fill:#A39E91}.bar{fill:#A39E91}
.lim{stroke:#F0624D}.limt{fill:#F0624D}.okin{fill:#1C1C1C}.dot,.big{fill:#C6F432}.cum{stroke:#C6F432}.ax{stroke:#3A3A36}}
</style><rect class="bg" width="960" height="400" rx="14"/><text class="k" x="40" y="44">WHAT A PER-PAYMENT CHECK SEES</text><text class="s" x="40" y="66">Six payments to one payee, each $5 under the $500 limit</text><line class="ax" x1="40" y1="310" x2="440" y2="310"/><rect class="bar" x="51.333333333333336" y="128.5" width="44" height="181.5" rx="3"/><text class="okin" x="68.33333333333334" y="152.5">✓</text><text class="s" x="59.33333333333334" y="330">$495</text><rect class="bar" x="118" y="128.5" width="44" height="181.5" rx="3"/><text class="okin" x="135" y="152.5">✓</text><text class="s" x="126" y="330">$495</text><rect class="bar" x="184.66666666666669" y="128.5" width="44" height="181.5" rx="3"/><text class="okin" x="201.66666666666669" y="152.5">✓</text><text class="s" x="192.66666666666669" y="330">$495</text><rect class="bar" x="251.33333333333334" y="128.5" width="44" height="181.5" rx="3"/><text class="okin" x="268.33333333333337" y="152.5">✓</text><text class="s" x="259.33333333333337" y="330">$495</text><rect class="bar" x="318" y="128.5" width="44" height="181.5" rx="3"/><text class="okin" x="335" y="152.5">✓</text><text class="s" x="326" y="330">$495</text><rect class="bar" x="384.6666666666667" y="128.5" width="44" height="181.5" rx="3"/><text class="okin" x="401.6666666666667" y="152.5">✓</text><text class="s" x="392.6666666666667" y="330">$495</text><line class="lim" x1="40" y1="126.66666666666669" x2="440" y2="126.66666666666669"/><text class="limt" x="300" y="116.66666666666669">$500 per-payment limit</text><text class="k" x="520" y="44">WHAT THE AGENT'S HISTORY SHOWS</text><text class="s" x="520" y="66">Running total to the same payee within one hour</text><line class="ax" x1="520" y1="310" x2="920" y2="310"/><path class="cum" d="M520 310 H553.3333333333334 V275.96875 H620 V241.9375 H686.6666666666667 V207.90625 H753.3333333333334 V173.875 H820 V139.84375 H886.6666666666667 V105.81249999999997 H920"/><circle class="dot" cx="553.3333333333334" cy="275.96875" r="4"/><circle class="dot" cx="620" cy="241.9375" r="4"/><circle class="dot" cx="686.6666666666667" cy="207.90625" r="4"/><circle class="dot" cx="753.3333333333334" cy="173.875" r="4"/><circle class="dot" cx="820" cy="139.84375" r="4"/><circle class="dot" cx="886.6666666666667" cy="105.81249999999997" r="4"/><text class="big" x="770" y="91.81249999999997">$2,970 in 1 hour</text><text class="s" x="520" y="330">0 min</text><text class="s" x="876" y="330">60 min</text><text class="t" x="40" y="370">Every payment passes. Only the running total shows a $2,970 spend split into six.</text></svg>
