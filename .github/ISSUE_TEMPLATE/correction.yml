name: Correction
description: A description, example or signal is wrong or unclear.
labels: ["correction"]
body:
  - type: input
    id: id
    attributes:
      label: Pattern ID
      placeholder: AFT-01
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested wording or fix
